name: Diagnose backend

# Manual probe of the production API: liveness + OTP endpoint behaviour.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe capabilities (liveness)
        run: curl -sS --max-time 240 -w "\nHTTP %{http_code}\n" https://bacand-iskra.onrender.com/api/capabilities
      - name: Probe OTP request (dummy captcha token, expect TURNSTILE error JSON)
        run: |
          curl -sS --max-time 240 -w "\nHTTP %{http_code}\n" \
            -X POST https://bacand-iskra.onrender.com/api/auth/otp/request \
            -H "content-type: application/json" \
            -H "origin: https://iskraai.run.place" \
            -d '{"email":"diag-probe@example.com","purpose":"register","captchaToken":"DUMMY_TOKEN_PROBE"}'
