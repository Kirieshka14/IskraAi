name: SMTP probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Brevo SMTP ports
        run: |
          for port in 587 465 25; do
            if timeout 12 bash -c "</dev/tcp/smtp-relay.brevo.com/$port" 2>/dev/null; then
              echo "port $port: OPEN"
            else
              echo "port $port: BLOCKED/TIMEOUT"
            fi
          done
          getent hosts smtp-relay.brevo.com || true
