name: Deploy frontend to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://bacand-iskra.onrender.com"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAEKIl3S-Vfy2BCGR"
      - name: Preserve custom domain
        run: |
          printf '%s\n' 'iskraai.run.place' > out/CNAME
          touch out/.nojekyll
      - name: Publish gh-pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a out/. /tmp/gh-pages/
          cd /tmp/gh-pages
          git add -A
          git commit -m "Deploy: refreshed interface and direct publishing" || exit 0
          git push origin HEAD:gh-pages
