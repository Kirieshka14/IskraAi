name: Keep backend warm

# Render free tier spins the API down after ~15 idle minutes, which makes
# registration requests fail with network errors while it wakes up.
# Ping the backend every 10 minutes so it stays responsive.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend capabilities
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 300 \
            "https://bacand-iskra.onrender.com/api/capabilities" > /dev/null \
            && echo "backend is awake" $(date -u)
